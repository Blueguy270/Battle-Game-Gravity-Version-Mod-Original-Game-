name: Build Electron App
name: Convert ZIP to EXE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Uses native Windows tools to create a self-extracting executable
      - name: Bundle ZIP into EXE
        shell: powershell
        run: |
          # Copy your zip file and give it an .exe extension
          Copy-Item "./your-game-file.zip" "./Battle-Game.exe"

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-windows-executable
          path: ./Battle-Game.exe
