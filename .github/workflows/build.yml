name: Convert ZIP to EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Bundle ZIP into EXE
        shell: powershell
        run: |
          Copy-Item "./Battle_Game_(Gravity)_project.zip" "./Battle-Game.exe"

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-windows-executable
          path: ./Battle-Game.exe
